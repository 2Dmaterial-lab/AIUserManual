{# Keep the statistics URL relative to this build, including subpath previews. #}
<div class="md-copyright">
  {% if config.copyright %}
    <div class="md-copyright__highlight">{{ config.copyright }}</div>
  {% endif %}
  <div class="md-copyright__highlight" id="site-ga-popularity"
       data-stats="{{ 'assets/analytics-stats.json' | url }}" aria-live="polite" hidden></div>
  {% if not config.extra.generator == false %}
    Made with
    <a href="https://squidfunk.github.io/mkdocs-material/" target="_blank" rel="noopener">Material for MkDocs</a>
  {% endif %}
</div>
